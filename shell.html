<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7f6f2">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="today">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="./icon-180.png">
  <title>today</title>
  <style>
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#f7f6f2}
    iframe{display:block;width:100%;height:100dvh;border:0;background:#f7f6f2}
  </style>
</head>
<body>
  <iframe id="today-frame" title="today task tracker"></iframe>
  <script>
    (()=>{
      try{
        const session=JSON.parse(localStorage.getItem('today.session.v1'));
        if(!session?.userId){location.replace('./index.html');return}
      }catch{location.replace('./index.html');return}
      document.querySelector('#today-frame').src='./app.html';
    })();
  </script>
</body>
</html>
