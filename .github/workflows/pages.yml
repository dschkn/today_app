name: ci and deploy today

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: today-production
  cancel-in-progress: true

jobs:
  validate:
    name: validate static app
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: verify required files
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            index.html
            app.html
            shell.html
            start.html
            sw.js
            manifest.webmanifest
            icon.svg
            icon-180.png
            icon-192.png
            icon-512.png
            runtime-config.js
            supabase-client.js
            auth-supabase.js
            shell-supabase.js
            app-supabase.js
          )

          for file in "${required_files[@]}"; do
            test -f "$file" || {
              echo "missing required file: $file" >&2
              exit 1
            }
          done

      - name: validate manifest and source files
        shell: bash
        run: |
          set -euo pipefail

          python3 -m json.tool manifest.webmanifest >/dev/null

          node --check runtime-config.js
          node --check supabase-client.js
          node --check auth-supabase.js
          node --check shell-supabase.js
          node --check app-supabase.js
          node --check sw.js

          if grep -RInE '^(<<<<<<<|=======|>>>>>>>)' \
            --include='*.html' \
            --include='*.js' \
            --include='*.json' \
            .; then
            echo "unresolved merge markers found" >&2
            exit 1
          fi

      - name: reject private material
        shell: bash
        run: |
          set -euo pipefail

          forbidden="$({
            git ls-files | grep -E '(^|/)(\.env($|\.)|id_rsa($|\.)|id_ed25519($|\.)|.*\.pem$|.*\.key$)' || true
          })"

          if [ -n "$forbidden" ]; then
            echo "private material must not be committed:" >&2
            printf '%s\n' "$forbidden" >&2
            exit 1
          fi

  deploy:
    name: deploy production
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: production

    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: prepare release
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.TODAY_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.TODAY_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail

          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_PUBLISHABLE_KEY"

          mkdir -p release
          cp \
            index.html \
            app.html \
            shell.html \
            start.html \
            sw.js \
            manifest.webmanifest \
            icon.svg \
            icon-180.png \
            icon-192.png \
            icon-512.png \
            runtime-config.js \
            supabase-client.js \
            auth-supabase.js \
            shell-supabase.js \
            app-supabase.js \
            release/

          python3 <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          release = Path('release')
          config = {
              'supabaseUrl': os.environ['SUPABASE_URL'],
              'supabasePublishableKey': os.environ['SUPABASE_PUBLISHABLE_KEY'],
          }
          (release / 'runtime-config.js').write_text(
              'window.TODAY_CONFIG=Object.freeze(' + json.dumps(config, separators=(',', ':')) + ');\n',
              encoding='utf-8',
          )

          index_path = release / 'index.html'
          index = index_path.read_text(encoding='utf-8')
          index_marker = '  <script>\n    (()=>{'
          index_injection = (
              '  <script src="./runtime-config.js"></script>\n'
              '  <script src="./supabase-client.js"></script>\n'
              '  <script src="./auth-supabase.js"></script>\n'
              '  <script>\n    (()=>{'
          )
          if index_marker not in index:
              raise SystemExit('index script marker not found')
          index_path.write_text(index.replace(index_marker, index_injection, 1), encoding='utf-8')

          app_path = release / 'app.html'
          app = app_path.read_text(encoding='utf-8')
          app_marker = '<script>\n(()=>{'
          app_injection = (
              '<script src="./runtime-config.js"></script>\n'
              '<script src="./supabase-client.js"></script>\n'
              '<script src="./app-supabase.js"></script>\n'
              '<script>\n(()=>{'
          )
          if app_marker not in app:
              raise SystemExit('app script marker not found')
          app_path.write_text(app.replace(app_marker, app_injection, 1), encoding='utf-8')

          shell_path = release / 'shell.html'
          shell = shell_path.read_text(encoding='utf-8')
          replacement = (
              '  <script src="./runtime-config.js"></script>\n'
              '  <script src="./supabase-client.js"></script>\n'
              '  <script src="./shell-supabase.js"></script>\n'
              '</body>'
          )
          shell, count = re.subn(r'  <script>\s*\(\(\)=>\{.*?</script>\s*</body>', replacement, shell, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('shell script block not found')
          shell_path.write_text(shell, encoding='utf-8')
          PY

          grep -q 'auth-supabase.js' release/index.html
          grep -q 'app-supabase.js' release/app.html
          grep -q 'shell-supabase.js' release/shell.html
          grep -q 'api.today.boatbehind.online' release/runtime-config.js
          test -f release/index.html

      - name: configure restricted ssh key
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.TODAY_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.TODAY_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/today_app"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/today_app" "$HOME/.ssh/known_hosts"

      - name: deploy immutable release
        shell: bash
        env:
          SSH_HOST: ${{ secrets.TODAY_SSH_HOST }}
        run: |
          set -euo pipefail

          tar -C release -czf - . | \
            ssh \
              -i "$HOME/.ssh/today_app" \
              -o IdentitiesOnly=yes \
              -o BatchMode=yes \
              -o StrictHostKeyChecking=yes \
              -o ConnectTimeout=20 \
              "dschkn@${SSH_HOST}" \
              "deploy ${GITHUB_SHA}"

      - name: verify production
        shell: bash
        env:
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.TODAY_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail

          curl \
            --fail \
            --show-error \
            --silent \
            --location \
            --retry 8 \
            --retry-delay 5 \
            --retry-connrefused \
            --max-time 20 \
            "https://today.boatbehind.online/?deploy=${GITHUB_SHA}" \
            >/dev/null

          curl \
            --fail \
            --show-error \
            --silent \
            --retry 8 \
            --retry-delay 5 \
            --max-time 20 \
            "https://today.boatbehind.online/runtime-config.js?deploy=${GITHUB_SHA}" \
            | grep -q 'https://api.today.boatbehind.online'

          curl \
            --fail \
            --show-error \
            --silent \
            --retry 5 \
            --retry-delay 3 \
            --max-time 20 \
            -H "apikey: ${SUPABASE_PUBLISHABLE_KEY}" \
            "https://api.today.boatbehind.online/auth/v1/settings" \
            >/dev/null

          echo "deployed ${GITHUB_SHA} with supabase connectivity"
